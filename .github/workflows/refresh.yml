name: refresh

on:
  schedule:
    # Daytime (8am-8pm PT, every 2h) + single night run at 10pm PT.
    # UTC times below assume PDT (UTC-7). When DST ends in early November,
    # subtract 1 hour from each UTC entry below (or just bump them all by +1 in winter).
    #   15 UTC = 08 PDT   17 = 10 PDT   19 = 12 PDT   21 = 14 PDT
    #   23 UTC = 16 PDT   01 = 18 PDT   03 = 20 PDT   05 = 22 PDT (the night run)
    - cron: "0 1,3,5,15,17,19,21,23 * * *"
  workflow_dispatch:         # manual "Run workflow" button

permissions:
  contents: write            # cron commits seen.db + dist/index.html

concurrency:
  group: refresh
  cancel-in-progress: false  # let in-flight runs finish

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run cron pipeline
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cron.py

      - name: Commit + push state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.db dist/index.html
          if git diff --staged --quiet; then
            echo "[git] no changes to commit"
          else
            git commit -m "data: cron refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        if: env.VERCEL_TOKEN != ''
        run: |
          cd dist
          npx --yes vercel deploy --prod --yes --token="$VERCEL_TOKEN"
